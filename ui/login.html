<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - App Keuangan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --bg-dark: #0b0d10;
            --card-bg: rgba(22, 25, 30, 0.6);
        }

        body {
            background-color: var(--bg-dark);
            /* Efek cahaya gradasi halus di background */
            background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(251, 191, 36, 0.05), transparent 50%);
            color: #e0e0e0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }

        /* Efek Glassmorphism untuk Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Ikon Logo / Accent Atas */
        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-green), #047857);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Floating Labels Bootstrap */
        .form-floating {
            margin-bottom: 1.5rem;
        }

        .form-floating>.form-control {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 14px;
            height: 60px;
        }

        .form-floating>.form-control:focus {
            background-color: rgba(0, 0, 0, 0.4);
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .form-floating>label {
            color: #808080;
            padding-left: 1rem;
        }

        .form-floating>.form-control:focus~label,
        .form-floating>.form-control:not(:placeholder-shown)~label {
            color: var(--accent-green);
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            background: transparent;
        }

        /* Tombol dengan Glow Effect */
        .btn-glow {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            border: none;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(16, 185, 129, 0.4);
            color: #fff;
        }

        .text-gold {
            color: var(--accent-gold);
        }

        .header-text {
            letter-spacing: -0.5px;
        }

        .toggle-link {
            color: var(--accent-green);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .toggle-link:hover {
            color: var(--accent-gold);
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div class="brand-icon">
                    <i class="bi bi-wallet2"></i>
                </div>
                <h3 class="text-gold fw-bold header-text" id="formTitle">Selamat Datang</h3>
                <p class="text-muted" id="formSubtitle">Masuk ke catatan keuanganmu</p>
            </div>

            <form id="authForm">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email"><i class="bi bi-envelope me-2"></i>Alamat Email</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password"><i class="bi bi-shield-lock me-2"></i>Kata Sandi</label>
                </div>

                <button type="submit" class="btn btn-glow w-100 mb-4" id="submitBtn">Masuk Sekarang</button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0" id="toggleText" style="font-size: 0.95rem;">
                    Pengguna baru? <span class="toggle-link" onclick="toggleMode()">Buat akun disini</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');
            const btn = document.getElementById('submitBtn');
            const toggle = document.getElementById('toggleText');

            title.style.opacity = 0; subtitle.style.opacity = 0;

            setTimeout(() => {
                title.innerText = isLogin ? 'Selamat Datang' : 'Buat Akun';
                subtitle.innerText = isLogin ? 'Masuk ke catatan keuanganmu' : 'Mulai rapiin pengeluaranmu hari ini';
                btn.innerText = isLogin ? 'Masuk Sekarang' : 'Daftar Sekarang';
                toggle.innerHTML = isLogin
                    ? 'Pengguna baru? <span class="toggle-link" onclick="toggleMode()">Buat akun disini</span>'
                    : 'Sudah punya akun? <span class="toggle-link" onclick="toggleMode()">Masuk disini</span>';

                title.style.opacity = 1; subtitle.style.opacity = 1;
            }, 150);
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            const originalText = btn.innerText;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';
            btn.disabled = true;

            try {
                if (isLogin) {
                    const formData = new FormData();
                    formData.append('username', email);
                    formData.append('password', password);

                    // Panggil ke /token sesuai auth.py
                    const res = await fetch('http://127.0.0.1:8000/token', {
                        method: 'POST',
                        body: formData
                    });

                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem('accessToken', data.access_token);
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('Gagal login: Email atau Kata Sandi salah!');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } else {
                    // Panggil ke /register sesuai auth.py
                    const res = await fetch('http://127.0.0.1:8000/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    });

                    if (res.ok) {
                        alert('Sukses! Akun berhasil dibuat. Silakan masuk.');
                        toggleMode();
                        document.getElementById('password').value = '';
                    } else {
                        const data = await res.json();
                        alert('Gagal daftar: ' + (data.detail || 'Email sudah digunakan'));
                    }
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Server belum merespon. Coba cek terminal Uvicorn lu.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
