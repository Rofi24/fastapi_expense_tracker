<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ExpensePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --border-color: #333333;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        .navbar { background-color: var(--card-dark); border-bottom: 1px solid var(--border-color); }
        .navbar-brand { color: var(--accent-gold) !important; font-weight: 700; }
        
        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        
        .text-gold { color: var(--accent-gold); }
        .text-green { color: var(--accent-green); }
        
        .btn-green {
            background-color: var(--accent-green);
            color: #fff;
            font-weight: 600;
        }
        .btn-green:hover { background-color: #059669; color: #fff; }

        .table { color: var(--text-main); }
        .table th { background-color: #252525; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        .table td { border-bottom: 1px solid var(--border-color); vertical-align: middle; }

        .modal-content { background-color: var(--card-dark); color: var(--text-main); border: 1px solid var(--border-color); }
        .form-control, .form-select {
            background-color: #2d2d2d;
            color: #fff;
            border: 1px solid var(--border-color);
        }
        .form-control:focus, .form-select:focus {
            background-color: #2d2d2d;
            color: #fff;
            border-color: var(--accent-green);
            box-shadow: none;
        }
        .badge-platform { background-color: #374151; color: var(--text-main); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg py-3 mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-wallet2 me-2"></i>Catatan Pengeluaran</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</button>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card p-4">
                    <p class="text-muted mb-1">Total Pengeluaran Bulan Ini</p>
                    <h2 class="text-green fw-bold mb-0" id="totalExpenseDisplay">Rp 0</h2>
                </div>
            </div>
            <div class="col-md-6 mb-3 d-flex align-items-center justify-content-end">
                <button class="btn btn-green px-4 py-2" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-2"></i>Tambah Catatan
                </button>
            </div>
        </div>

        <h5 class="mb-3 text-gold"><i class="bi bi-cart3 me-2"></i>Pengeluaran Rutin</h5>
        <div class="card mb-5">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Keperluan</th>
                            <th>Nominal</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="rutinTableBody"></tbody>
                </table>
            </div>
        </div>

        <h5 class="mb-3 text-gold"><i class="bi bi-calendar3 me-2"></i>Daftar Cicilan Berjangka</h5>
        <div class="card mb-5">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Keperluan</th>
                            <th>Platform</th>
                            <th>Tempo</th>
                            <th>Tenor</th>
                            <th>Nominal</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="cicilanTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="transactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Tambah Catatan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="transactionForm">
                        <div class="mb-3">
                            <label class="form-label">Kategori</label>
                            <select class="form-select" id="category" required>
                                <option value="Rutin">Pengeluaran Rutin</option>
                                <option value="Cicilan">Cicilan Berjangka</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Keperluan</label>
                            <input type="text" class="form-control" id="title" placeholder="Contoh: Beras, Kontrakan, Tumbler" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nominal (Rp)</label>
                            <input type="number" class="form-control" id="amount" required>
                        </div>

                        <div id="cicilanFields" class="d-none">
                            <div class="mb-3">
                                <label class="form-label">Platform (Shopee, Adakami, dll)</label>
                                <input type="text" class="form-control" id="platform">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tanggal Jatuh Tempo (Contoh: 11)</label>
                                <input type="text" class="form-control" id="tanggal_tempo">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Cicilan Ke-</label>
                                    <input type="number" class="form-control" id="tenor_berjalan">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Dari Total (Bulan)</label>
                                    <input type="number" class="form-control" id="total_tenor">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-green w-100 mt-3">Simpan Data</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('accessToken');
        if (!token) window.location.href = 'login.html';

        const modalElement = new bootstrap.Modal(document.getElementById('transactionModal'));
        let editingId = null; // Kunci utama buat bedain Tambah vs Edit

        // Fungsi buat reset form pas mau nambah data baru
        function openAddModal() {
            editingId = null;
            document.querySelector('.modal-title').innerText = "Tambah Catatan";
            document.getElementById('transactionForm').reset();
            document.getElementById('cicilanFields').classList.add('d-none');
            modalElement.show();
        }

        // Fungsi buat isi form otomatis pas mau ngedit data
        function openEditModal(trx) {
            editingId = trx.id;
            document.querySelector('.modal-title').innerText = "Edit Catatan";
            
            document.getElementById('category').value = trx.category;
            document.getElementById('title').value = trx.title;
            document.getElementById('amount').value = trx.amount;
            
            const cicilanFields = document.getElementById('cicilanFields');
            if(trx.category === 'Cicilan') {
                cicilanFields.classList.remove('d-none');
                document.getElementById('platform').value = trx.platform;
                document.getElementById('tanggal_tempo').value = trx.tanggal_tempo;
                document.getElementById('tenor_berjalan').value = trx.tenor_berjalan;
                document.getElementById('total_tenor').value = trx.total_tenor;
            } else {
                cicilanFields.classList.add('d-none');
            }
            modalElement.show();
        }

        // Logika nampilin form cicilan
        document.getElementById('category').addEventListener('change', function() {
            const cicilanFields = document.getElementById('cicilanFields');
            if(this.value === 'Cicilan') {
                cicilanFields.classList.remove('d-none');
            } else {
                cicilanFields.classList.add('d-none');
            }
        });

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        async function loadTransactions() {
            try {
                const response = await fetch('http://127.0.0.1:8000/transactions/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (response.status === 401) return logout();
                
                const data = await response.json();
                renderTables(data);
                calculateTotal(data);
            } catch (error) { console.error(error); }
        }

        function renderTables(data) {
            const rutinBody = document.getElementById('rutinTableBody');
            const cicilanBody = document.getElementById('cicilanTableBody');
            rutinBody.innerHTML = '';
            cicilanBody.innerHTML = '';

            data.forEach(trx => {
                const tr = document.createElement('tr');
                
                if(trx.category === 'Cicilan') {
                    tr.innerHTML = `
                        <td class="fw-medium">${trx.title}</td>
                        <td><span class="badge badge-platform">${trx.platform || '-'}</span></td>
                        <td>Tgl ${trx.tanggal_tempo || '-'}</td>
                        <td>(${trx.tenor_berjalan || 0}/${trx.total_tenor || 0})</td>
                        <td class="fw-bold">${formatRupiah(trx.amount)}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-warning me-2" onclick="openEditModal(${JSON.stringify(trx).replace(/"/g, '&quot;')})">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${trx.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    `;
                    cicilanBody.appendChild(tr);
                } else {
                    tr.innerHTML = `
                        <td class="fw-medium">${trx.title}</td>
                        <td class="fw-bold">${formatRupiah(trx.amount)}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-warning me-2" onclick="openEditModal(${JSON.stringify(trx).replace(/"/g, '&quot;')})">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteTransaction(${trx.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    `;
                    rutinBody.appendChild(tr);
                }
            });
        }

        // LOGIKA DINAMIS: Bisa POST (Baru) atau PUT (Update)
        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                title: document.getElementById('title').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                platform: document.getElementById('platform').value || null,
                tanggal_tempo: document.getElementById('tanggal_tempo').value || null,
                tenor_berjalan: document.getElementById('tenor_berjalan').value ? parseInt(document.getElementById('tenor_berjalan').value) : null,
                total_tenor: document.getElementById('total_tenor').value ? parseInt(document.getElementById('total_tenor').value) : null
            };

            const url = editingId 
                ? `http://127.0.0.1:8000/transactions/${editingId}` 
                : 'http://127.0.0.1:8000/transactions/';
            const method = editingId ? 'PUT' : 'POST'; // Pakai PUT kalau editingId ada isinya

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    modalElement.hide();
                    loadTransactions();
                } else {
                    alert("Gagal memproses data!");
                }
            } catch (error) { console.error(error); }
        });

        async function deleteTransaction(id) {
            if (!confirm("Hapus catatan ini?")) return;
            try {
                const response = await fetch(`http://127.0.0.1:8000/transactions/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) loadTransactions();
            } catch (error) { console.error(error); }
        }

        function calculateTotal(data) {
            let totalAmount = 0;
            data.forEach(trx => totalAmount += trx.amount);
            document.getElementById('totalExpenseDisplay').innerText = formatRupiah(totalAmount);
        }

        function logout() {
            localStorage.removeItem('accessToken');
            window.location.href = 'login.html';
        }

        loadTransactions();
    </script>
</body>
</html>
